apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: seed-daemonset
  labels:
    app: seed
spec:
  selector:
    matchLabels:
      app: seed
  template:
    metadata:
      labels:
        app: seed
    spec:
      serviceAccountName: seed-service-account
      initContainers:
        - name: nfd-address
          image: ghcr.io/nakazato-lab/ndn-dhcp/ndn-dhcp-client:latest
          imagePullPolicy: Always
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: nfd-endpoint
              mountPath: /etc/ndn-config
      containers:
        - name: seed
          image: ghcr.io/nakazato-lab/ndn-tools-seed-python/ndn-seed:latest
          imagePullPolicy: Always
          env:
            - name: FUNCTION_IMAGE
              value: ghcr.io/nakazato-lab/ndn-tools-seed-python/ndn-function-runtime:latest
            - name: SIDECAR_IMAGE
              value: ghcr.io/nakazato-lab/ndn-tools-seed-python/ndn-function-sidecar:latest
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command: ["/bin/bash", "-c"]
          args:
            - |
              export NDN_CLIENT_TRANSPORT="tcp4://$(cat /etc/ndn-config/ADDRESS)"
              echo "Connecting to NFD at ${NDN_CLIENT_TRANSPORT}..."
              exec python -m seed -v --namespace ndn "/${NODE_NAME}/seed"
          volumeMounts:
            - name: nfd-endpoint
              mountPath: /etc/ndn-config
      volumes:
        - name: nfd-endpoint
          emptyDir: {}
