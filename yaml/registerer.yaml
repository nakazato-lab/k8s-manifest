apiVersion: batch/v1
kind: Job
metadata:
  name: registerer-job
  namespace: default
  labels:
    app: registerer
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: registerer
    spec:
      restartPolicy: Never

      # =========================================================
      # 1. 初期化コンテナ（NFDのIP取得 ＆ 起動待ち）
      # =========================================================
      initContainers:
      - name: wait-for-nfd-ip
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        command:
        - 'sh'
        - '-c'
        - |
            while true; do
              ENDPOINT=$(cat /etc/ndn-config/ADDRESS 2>/dev/null || echo 'not available yet')
              echo "NFD endpoint: $ENDPOINT"

              if [ "$ENDPOINT" != "not available yet" ]; then
                NFD_ADDR=$ENDPOINT
                break
              fi
              sleep 10
            done

            echo "Target NFD IP found: $NFD_ADDR"

            until nc -zvw3 "$NFD_ADDR"; do
              echo "waiting for NFD at $NFD_ADDR..."
              sleep 10
            done
        volumeMounts:
        - name: nfd-endpoint
          mountPath: /etc/ndn-config
          readOnly: true

      containers:
      - name: registerer
        image: ghcr.io/nakazato-lab/ndn_resorce_placement/ndn-registerer:latest
        imagePullPolicy: Always
        volumeMounts:
        - name: nfd-endpoint
          mountPath: /etc/ndn-config
          readOnly: true

      volumes:
      # NFDのIPが格納されているConfigMap
      - name: nfd-endpoint
        configMap:
          name: nfd-config
          optional: true
