apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: seed-daemonset
  labels:
    app: seed
spec:
  selector:
    matchLabels:
      app: seed
  template:
    metadata:
      labels:
        app: seed
    spec:
      serviceAccountName: seed-service-account
      # nfd待機用initContainers 検討
      initContainers:
        - name: wait-for-nfd-ip
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - "sh"
            - "-c"
            - |
              while true; do
                ENDPOINT=$(cat /etc/nfd-config/ADDRESS 2>/dev/null || echo 'not available yet')
                echo "NFD endpoint: $ENDPOINT"

                if [ -n "$ENDPOINT" ] && [ "$ENDPOINT" != "not available yet" ]; then
                  NFD_ADDR=$ENDPOINT
                  break
                fi
                sleep 10
              done

              echo "Target NFD IP found: $NFD_ADDR"

              case "$NFD_ADDR" in
                *:*) NFD_HOST=${NFD_ADDR%:*}; NFD_PORT=${NFD_ADDR##*:} ;;
                *) NFD_HOST=$NFD_ADDR; NFD_PORT=6363 ;;
              esac
              NFD_HOST=${NFD_HOST#\[}
              NFD_HOST=${NFD_HOST%\]}
              until nc -z -w 3 "$NFD_HOST" "$NFD_PORT"; do
                echo "waiting for NFD at $NFD_ADDR..."
                sleep 10
              done
          volumeMounts:
            - name: nfd-config
              mountPath: /etc/nfd-config
              readOnly: true
      containers:
        - name: seed
          image: ghcr.io/nakazato-lab/ndn-tools-seed-python/ndn-seed:latest
          imagePullPolicy: Always
          env:
            - name: FUNCTION_IMAGE
              value: ghcr.io/nakazato-lab/ndn-tools-seed-python/ndn-function-runtime:latest
            - name: SIDECAR_IMAGE
              value: ghcr.io/nakazato-lab/ndn-tools-seed-python/ndn-function-sidecar:latest
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command: ["/bin/bash", "-c"]
          # ConfigMapのNFD接続先を使ってPython版Seedを起動
          args:
            - |
              NFD_ADDR=$(cat /etc/nfd-config/ADDRESS)
              export NDN_CLIENT_TRANSPORT="tcp4://${NFD_ADDR}"
              echo "Connecting to NFD at ${NDN_CLIENT_TRANSPORT}..."
              exec python -m seed -v --namespace ndn "/${NODE_NAME}/seed"
          volumeMounts:
            - name: nfd-config
              mountPath: /etc/nfd-config
      volumes:
        - name: nfd-config
          configMap:
            name: nfd-config
            optional: false
