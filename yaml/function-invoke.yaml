apiVersion: batch/v1
kind: Job
metadata:
  name: function-invoke-job
  namespace: ndn
  labels:
    app: function-invoke
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  # Keep the completed Job so Argo CD self-heal does not repeatedly recreate it.
  template:
    metadata:
      labels:
        app: function-invoke
    spec:
      restartPolicy: Never
      containers:
        - name: consumer
          # Reuse the existing image containing python-ndn; override its entrypoint.
          image: ghcr.io/nakazato-lab/ndn-tools-seed-python/my-edge-function:latest
          imagePullPolicy: Always
          env:
            - name: FUNCTION_PREFIX
              value: /average
            - name: FUNCTION_ARGS
              value: '["10", "20"]'
            - name: NFD_CONFIG_PATH
              value: /etc/ndn-config/ADDRESS
          command: ["python", "-u", "/scripts/function_invoke.py"]
          volumeMounts:
            - name: consumer-script
              mountPath: /scripts
              readOnly: true
            - name: nfd-endpoint
              mountPath: /etc/ndn-config
              readOnly: true
      volumes:
        - name: consumer-script
          configMap:
            name: function-invoke-script
        - name: nfd-endpoint
          configMap:
            name: nfd-config
            optional: true
