apiVersion: v1
kind: Service
metadata:
  name: nfd
spec:
  selector:
    app: nfd
  ports:
    - name: ndn-tcp
      port: 6363
      protocol: TCP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nfd-client-config
data:
  ADDRESS: nfd:6363
---
# Per-router Services keep peer addresses stable when a Pod is recreated.
apiVersion: v1
kind: Service
metadata:
  name: nfd-peer-0
spec:
  selector:
    statefulset.kubernetes.io/pod-name: nfd-0
  ports:
    - name: ndn-tcp
      port: 6363
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: nfd-peer-1
spec:
  selector:
    statefulset.kubernetes.io/pod-name: nfd-1
  ports:
    - name: ndn-tcp
      port: 6363
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: nfd-headless
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: nfd
  ports:
    - name: ndn-tcp
      port: 6363
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nfd
  labels:
    app: nfd
spec:
  serviceName: nfd-headless
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: nfd
  template:
    metadata:
      labels:
        app: nfd
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: nfd
              topologyKey: kubernetes.io/hostname
      containers:
        - name: nfd
          image: ghcr.io/nakazato-lab/k8s-manifest/ndn-nfd:latest
          imagePullPolicy: Always
          command: [/bin/sh, /config/start-nfd.sh]
          env:
            - name: NDN_CLIENT_TRANSPORT
              value: unix:///run/nfd.sock
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: ndn-tcp
              containerPort: 6363
              protocol: TCP
            - name: ndn-udp
              containerPort: 6363
              protocol: UDP
          securityContext:
            privileged: true
          readinessProbe:
            tcpSocket:
              port: ndn-tcp
            periodSeconds: 5
          volumeMounts:
            - name: nfd-socket-dir
              mountPath: /run
            - name: nlsr-config
              mountPath: /config
              readOnly: true
        - name: nlsr
          image: ghcr.io/nakazato-lab/k8s-manifest/ndn-nlsr:latest
          imagePullPolicy: Always
          command: [/bin/sh, /config/start-nlsr.sh]
          env:
            - name: NDN_CLIENT_TRANSPORT
              value: unix:///run/nfd.sock
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: nfd-socket-dir
              mountPath: /run
            - name: nlsr-config
              mountPath: /config
              readOnly: true
            - name: nlsr-state
              mountPath: /var/lib/nlsr
            - name: nlsr-state
              mountPath: /root/.ndn
      volumes:
        - name: nfd-socket-dir
          emptyDir: {}
        - name: nlsr-config
          configMap:
            name: nfd-nlsr-config
  # Retain sequence numbers and router keys across Pod recreation.
  volumeClaimTemplates:
    - metadata:
        name: nlsr-state
      spec:
        storageClassName: longhorn
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 128Mi
