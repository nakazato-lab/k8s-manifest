general
{
  network /ndn
  site /k8s
  router /%C1.Router/@ROUTER@
  lsa-refresh-time 240
  state-dir /var/lib/nlsr/state
}
neighbors
{
  hello-interval 30
  adj-lsa-build-interval 5
  neighbor
  {
    name /ndn/k8s/%C1.Router/@PEER@
    face-uri tcp4://@PEER_IP@:6363
    link-cost 10
  }
}
fib
{
  max-faces-per-prefix 1
  routing-calc-interval 10
}
advertising
{
}
security
{
  ; Lab configuration, matching the existing permissive NFD trust policy.
  ; Replace with certificate validation before use on an untrusted network.
  validator
  {
    trust-anchor
    {
      type any
    }
  }
  prefix-update-validator
  {
    trust-anchor
    {
      type any
    }
  }
  cert-to-publish /var/lib/nlsr/router.cert
}
