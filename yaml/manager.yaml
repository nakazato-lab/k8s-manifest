apiVersion: apps/v1
kind: Deployment
metadata:
  name: manager-deployment
  labels:
    app: manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: manager
  template:
    metadata:
      labels:
        app: manager
    spec:
      serviceAccountName: manager-service-account
      initContainers:
        - name: nfd-address
          image: ghcr.io/nakazato-lab/ndn-dhcp/ndn-dhcp-client:latest
          imagePullPolicy: Always
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: nfd-endpoint
              mountPath: /etc/ndn-config
      containers:
        - name: manager
          image: ghcr.io/nakazato-lab/ndn_resorce_placement/ndn-manager:latest
          imagePullPolicy: Always
          volumeMounts:
            - name: nfd-endpoint
              mountPath: /etc/ndn-config
      volumes:
        - name: nfd-endpoint
          emptyDir: {}
