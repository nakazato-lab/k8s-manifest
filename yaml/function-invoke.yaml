apiVersion: batch/v1
kind: Job
metadata:
  name: function-invoke-job
  namespace: ndn
  annotations:
    argocd.argoproj.io/sync-options: Force=true,Replace=true
  labels:
    app: function-invoke
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  # Keep the completed Job so Argo CD self-heal does not repeatedly recreate it.
  template:
    metadata:
      labels:
        app: function-invoke
    spec:
      restartPolicy: Never
      containers:
        - name: consumer
          image: ghcr.io/nakazato-lab/ndn-tools-seed-python/ndn-function-runtime:latest
          imagePullPolicy: Always
          env:
            - name: NDN_SCRIPT_PATH
              value: /functions/use_average.ndn
            - name: NFD_CONFIG_PATH
              value: /etc/ndn-config/ADDRESS
          command: ["python", "-u", "/scripts/function_invoke.py"]
          volumeMounts:
            - name: consumer-script
              mountPath: /scripts
              readOnly: true
            - name: invoke-source
              mountPath: /functions
              readOnly: true
            - name: nfd-endpoint
              mountPath: /etc/ndn-config
              readOnly: true
      volumes:
        - name: consumer-script
          configMap:
            name: function-invoke-script
        - name: invoke-source
          configMap:
            name: function-invoke-source
        - name: nfd-endpoint
          configMap:
            name: nfd-config
            optional: true
