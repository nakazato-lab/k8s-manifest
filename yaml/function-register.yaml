apiVersion: batch/v1
kind: Job
metadata:
  name: function-register-rename-to-kanji-b1c95ec236b8
  namespace: ndn
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app: function-register
    spec:
      restartPolicy: Never
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: function-register
      initContainers:
      - name: nfd-address
        image: ghcr.io/nakazato-lab/ndn-dhcp/ndn-dhcp-client:latest
        imagePullPolicy: Always
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: nfd-endpoint
          mountPath: /etc/ndn-config
      containers:
      - name: registerer
        image: ghcr.io/nakazato-lab/function-utils/ndn-function-registerer:latest
        imagePullPolicy: Always
        command:
        - python
        - -u
        - /app/register.py
        env:
        - name: NFD_CONFIG_PATH
          value: /etc/ndn-config/ADDRESS
        - name: NFD_NAME_PATH
          value: /etc/ndn-config/ROUTER_NAME
        - name: FUNCTION_NAME
          value: rename_to_kanji
        - name: FUNCTION_RUNTIME
          value: python
        - name: FUNCTION_CODE
          value: |
            import sys

            arg0 = sys.argv[1]
            if arg0 == "Tokyo":
                print("東京")
            else:
                print("不明")
        - name: FUNCTION_REQUIREMENTS
          value: '[]'
        - name: FUNCTION_PREFERENCE_CPU
          value: medium
        - name: FUNCTION_PREFERENCE_MEMORY
          value: medium
        - name: FUNCTION_PREFERENCE_BANDWIDTH
          value: medium
        - name: MANAGER_REGISTER_NAME
          value: /Manager/register
        volumeMounts:
        - name: nfd-endpoint
          mountPath: /etc/ndn-config
          readOnly: true
      volumes:
      - name: nfd-endpoint
        emptyDir: {}
