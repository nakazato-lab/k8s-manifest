apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: spy-daemonset
  labels:
    app: spy
spec:
  selector:
    matchLabels:
      app: spy
  template:
    metadata:
      labels:
        app: spy
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/os: linux
      serviceAccountName: spy-service-account
      initContainers:
        - name: nfd-address
          image: ghcr.io/nakazato-lab/ndn-dhcp/ndn-dhcp-client:latest
          imagePullPolicy: Always
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: nfd-endpoint
              mountPath: /etc/ndn-config
      containers:
        - name: spy
          image: ghcr.io/nakazato-lab/ndn_resorce_placement/ndn-spy:latest
          imagePullPolicy: Always
          env:
            - name: NODE_EXPORTER_URL
              value: http://127.0.0.1:9100/metrics
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: nfd-endpoint
              mountPath: /etc/ndn-config
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
        - name: node-exporter
          image: quay.io/prometheus/node-exporter:v1.12.1
          imagePullPolicy: IfNotPresent
          args:
            - --web.listen-address=:9100
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            - --collector.disable-defaults
            - --collector.netdev
            - --collector.netclass
            - --collector.netclass.ignore-invalid-speed
          ports:
            - name: metrics
              containerPort: 9100
              hostPort: 9100
              protocol: TCP
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
            - name: host-sys
              mountPath: /host/sys
              readOnly: true
      volumes:
        - name: nfd-endpoint
          emptyDir: {}
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
        - name: host-sys
          hostPath:
            path: /sys
            type: Directory
